<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Options Chain — demystified</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#F5F0E8; font-family:system-ui,-apple-system,sans-serif; color:#1a1108; min-height:100vh; }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
.fu  { animation:fadeUp  0.3s ease forwards; }
.si  { animation:slideIn 0.25s ease forwards; }
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#C4A460;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

const OR="#F5853F", RD="#D94F2A", GR="#0D9E6E", GD="#C4A460";
const PU="#7C5CBF", BL="#2A7ED4", DK="#1a1108";
const CA="#fffcf7", BD="#e8ddd0";

const STOCK = 50.00;
const CHAIN = [
  {strike:46,ask:4.50,bid:4.30,last:4.40,delta:0.882,theta:-0.012,gamma:0.028,vega:0.045,volume:1240,oi:3200},
  {strike:47,ask:3.60,bid:3.40,last:3.50,delta:0.810,theta:-0.015,gamma:0.038,vega:0.058,volume:870,oi:2800},
  {strike:48,ask:2.75,bid:2.55,last:2.65,delta:0.720,theta:-0.018,gamma:0.051,vega:0.072,volume:1550,oi:4100},
  {strike:49,ask:1.95,bid:1.80,last:1.88,delta:0.614,theta:-0.021,gamma:0.065,vega:0.083,volume:2300,oi:5600},
  {strike:50,ask:1.30,bid:1.18,last:1.24,delta:0.505,theta:-0.023,gamma:0.072,vega:0.089,volume:6800,oi:12400},
  {strike:51,ask:0.80,bid:0.70,last:0.75,delta:0.388,theta:-0.021,gamma:0.068,vega:0.083,volume:3100,oi:7200},
  {strike:52,ask:0.45,bid:0.38,last:0.42,delta:0.272,theta:-0.017,gamma:0.056,vega:0.068,volume:1800,oi:4500},
  {strike:53,ask:0.22,bid:0.17,last:0.20,delta:0.172,theta:-0.012,gamma:0.040,vega:0.050,volume:920,oi:2100},
  {strike:54,ask:0.10,bid:0.07,last:0.09,delta:0.098,theta:-0.007,gamma:0.026,vega:0.033,volume:340,oi:850},
];

const TERMS = {
  strike:{icon:"🎯",label:"Strike Price",color:DK,group:"pricing",short:"The locked-in price — the heart of every option contract.",what:"The price you agree to buy the stock, locked in the moment you purchase the contract. It never changes.",why:"For a Call, the stock must rise above your strike for the contract to gain real value. It's your target.",analogy:"Think of it like a coupon. A store sells a jacket for $50 today. Your coupon locks in a buy price of $51. If the jacket's price jumps to $60, your coupon is now worth $9. That $51 is your strike price.",rule:null,example:"Stock is at $50. You buy a Call with a $51 strike. The stock needs to climb above $51 for your contract to be in the money at expiration.",zones:[{label:"Strike BELOW stock price",status:"In The Money (ITM)",color:GR,desc:"The stock has already passed your strike. Your contract has real value right now."},{label:"Strike AT stock price",status:"At The Money (ATM)",color:OR,desc:"The stock is right at your strike. Your contract is on the edge — could go either way."},{label:"Strike ABOVE stock price",status:"Out of The Money (OTM)",color:"#8a7560",desc:"The stock hasn't reached your strike yet. It needs to move in your direction."}],checklist:null},
  expiry:{icon:"📅",label:"Expiration Date",color:PU,group:"pricing",short:"The date your contract stops existing — choose this before anything else.",what:"The last day your contract can be traded. After this date it no longer exists — if it's out of the money, it expires worthless and you lose the premium paid.",why:"Your first decision before buying. It determines how much time your thesis has to play out and how fast Theta eats your contract's value.",analogy:"Like a concert ticket with a date on it. If the concert date passes and you never used the ticket, it is worth nothing. You cannot use it the next day — it is gone. Options work exactly the same way.",rule:"Always choose 30+ days to expiration. This gives your trade breathing room and slows Theta decay. In the final two weeks, time decay accelerates sharply — your contract can lose value fast even when the stock is moving your way.",example:"You buy a Call expiring in 5 days. Even if the stock moves up, Theta has been eating value all week. By day 5, if not deep ITM, the contract may be worth almost nothing.",zones:[{label:"30+ days to expiry",status:"Safe Zone",color:GR,desc:"Theta is slow. Your thesis has time to play out. Dominique's required minimum."},{label:"15–30 days to expiry",status:"Caution",color:GD,desc:"Decay picks up speed. Stock needs to be moving your way."},{label:"Under 15 days",status:"Danger Zone",color:RD,desc:"Rapid decay. Value evaporating quickly. Not for beginners."}],checklist:"Used in the Pre-Trade Checklist — Question 3 asks: Is my expiration 30+ days out?"},
  ask:{icon:"🏷️",label:"Ask Price",color:RD,group:"pricing",short:"What you pay to buy the contract.",what:"The price sellers want for their contract — what you pay when buying. Always the higher of the two quoted prices.",why:"Every contract = 100 shares. Ask × 100 = your total cost and maximum risk if the option expires worthless.",analogy:"Like a price tag in a store. The seller has set a price. You can pay it immediately and walk away with the contract, or try to negotiate.",rule:"Use the Ask as your ceiling — the worst price you would accept. Then look at the Last price to see what sellers actually took recently, and try a limit order in between.",example:"Ask $1.30 × 100 shares = $130 per contract. Always multiply by 100 to know your real cost (premium).",zones:null,checklist:null},
  bid:{icon:"🤝",label:"Bid Price",color:BL,group:"pricing",short:"What you receive when you sell the contract.",what:"What buyers are willing to pay. When you sell to exit, you receive the Bid — always the lower of the two quoted prices.",why:"The gap between Ask and Bid is the Spread. Tight spread = fair market. Wide spread = you pay more in and receive less out.",analogy:"Like selling a used car. The buyer offers you $1,180 (Bid). You listed it for $1,300 (Ask). A deal happens somewhere in between.",rule:"Spread % = (Ask − Bid) ÷ Ask. Under 5% is clean. Over 10% means the market is thin — enter with caution.",example:"Ask $1.30, Bid $1.18. Spread = $0.12 = 9.2%. If you bought at the Ask and sold immediately at the Bid, you would lose $12 per contract before the stock moves at all.",zones:null,checklist:null},
  last:{icon:"🕐",label:"Last Price",color:GD,group:"pricing",short:"The most recent real trade — your negotiation anchor.",what:"The price of the most recent actual trade — not what people are asking or offering, but what they agreed on.",why:"Your anchor for placing a limit order. Shows the lowest price sellers recently accepted — target between Last and Ask for a better entry.",analogy:"Like checking what the last house on your street sold for before listing yours. Not the asking price — the actual price someone paid.",rule:"Before placing any order, check Last. Target your limit between Last and Ask. Example: Ask $1.30, Last $1.24 → try $1.25 or $1.26. Saves money on every trade.",example:"Ask $1.30 · Last $1.24 · Bid $1.18. Place a limit at $1.25. You are offering just above what sellers recently accepted. Smart and disciplined.",zones:null,checklist:null},
  delta:{icon:"📡",label:"Delta (Δ)",color:OR,group:"greeks",short:"Your direction meter — how much the contract moves per $1 stock move.",what:"How much your contract moves for every $1 the stock moves. Delta 0.50 = contract gains ~$0.50 per $1 rise. Ranges from 0 to 1.",why:"Shows how connected your contract is to the stock. High Delta = moves like owning shares. Low Delta = barely responds. Stay in the responsive middle zone.",analogy:"Think of Delta as a volume dial from 0 to 1. At 0 the stock's movement makes no sound in your contract. At 1 it is full volume — every dollar the stock moves, your contract moves a dollar.",rule:"Sweet spot: 0.40 to 0.60. This keeps you near at-the-money — responsive enough to profit from stock movement without overpaying for deep ITM or gambling on deep OTM.",example:"Stock moves up $2. Your Delta is 0.50. Contract gains ≈ $1.00 per share × 100 shares = $100 gain on the contract.",zones:[{label:"0.80 – 1.00",status:"Deep ITM",color:GR,desc:"Moves almost like owning the stock. Expensive. Less leverage."},{label:"0.40 – 0.60 ✓",status:"Sweet Spot (Dominique's zone)",color:OR,desc:"Balanced — responds well to movement without overpaying."},{label:"0.20 – 0.40",status:"OTM",color:GD,desc:"Cheaper but needs a big stock move. Stock can rise and contract barely moves."},{label:"0.00 – 0.20",status:"Deep OTM",color:RD,desc:"Very cheap. Needs a large, fast move. High risk of expiring worthless."}],checklist:null},
  theta:{icon:"⏳",label:"Theta (Θ)",color:RD,group:"greeks",short:"Daily time decay — value your contract loses every single day.",what:"How much value your contract loses every single day, even when the stock doesn't move. Always shown as a negative number.",why:"As expiration approaches, your contract loses time value. Theta measures how fast — and accelerates sharply in the final weeks.",analogy:"Your contract is an ice cube. Stock movement adds ice. Theta melts it every single day regardless. You need the stock to add ice faster than Theta melts it.",rule:"Theta should be no more than 50% of your Delta. Example: Delta 0.50, Theta −0.023. That is 4.6% — well under the limit. This means time decay is not outpacing your direction advantage.",example:"You buy a contract Monday. By Friday — stock unmoved — you have lost 5 days × $0.023 = $0.115 per share × 100 = $11.50 in Theta decay. That cost is automatic.",zones:[{label:"30+ days to expiry",status:"Safe Zone",color:GR,desc:"Decay is slow. Your thesis has time to play out without pressure."},{label:"15–30 days to expiry",status:"Caution",color:GD,desc:"Decay picking up. The stock needs to be moving your way."},{label:"Under 15 days",status:"Danger Zone",color:RD,desc:"Value evaporating quickly. Not recommended for beginners."}],checklist:"Used in the Pre-Trade Checklist — Question 4 asks: Is my Theta no more than 50% of my Delta?"},
  gamma:{icon:"⚡",label:"Gamma (Γ)",color:PU,group:"greeks",short:"How fast Delta changes — Delta's accelerator.",what:"How much your Delta changes when the stock moves $1. Gamma 0.072 means Delta shifts 0.072 per $1 move.",why:"Highest near ATM and expiration. Works for you as the stock moves your way — and against you if it reverses.",analogy:"Delta is your car's current speed. Gamma is your car's acceleration. High acceleration means your speed changes fast — in either direction.",rule:"Gamma is an advanced concept. At beginner level just know: Gamma is highest near ATM, which is one reason ATM options are so active and responsive. You do not need to trade Gamma — but understanding it helps.",example:"Stock at $50. Delta is 0.50, Gamma 0.07. Stock moves to $51 → Delta becomes ≈ 0.57. The contract is now even more responsive to the next dollar move.",zones:null,checklist:null},
  vega:{icon:"🌪️",label:"Vega (V)",color:BL,group:"greeks",short:"Volatility gauge — how news and earnings affect your contract's value.",what:"How much your contract's value changes for every 1% shift in Implied Volatility (IV). High Vega = highly sensitive to news and earnings.",why:"Before earnings, volatility spikes and inflates premiums. After the announcement it collapses — crushing your contract even if the stock moved your way. This is called a Volatility Crush.",analogy:"Vega is like storm insurance. Before a storm warning, insurance prices jump. After the storm passes — even if it was bad — insurance cheapens fast. Buying high-Vega options before earnings is like buying expensive storm insurance.",rule:"Always check if an earnings date falls within your expiration window before entering a trade. High Vega near earnings = extra risk. The stock might move your way and you still lose because volatility collapsed.",example:"You buy a Call before earnings. The stock rises $3 — but IV drops from 60% to 25%. Your contract loses value and the trade ends as a loss even though you were right on direction.",zones:null,checklist:null},
  volume:{icon:"📊",label:"Volume",color:GD,group:"liquidity",short:"Contracts traded today — today's activity level.",what:"Total contracts bought and sold today. Resets to zero at market open — zero volume outside market hours is normal.",why:"High volume = active market, easy to enter and exit at fair prices. Low volume = fewer participants and harder to exit cleanly.",analogy:"Like foot traffic in a store. A busy store with hundreds of customers means fast transactions at fair prices. An empty store makes it hard to find someone willing to trade with you.",rule:"Check volume during market hours before entering. Look for at least a few hundred contracts on your chosen strike. Low volume today can still mean the strike is liquid — always check Open Interest alongside it.",example:"Strike $50 shows 6,800 volume — the most active on this chain. Strike $54 shows only 340. Exiting the $54 position quickly and fairly would be much harder.",zones:[{label:"1,000+ contracts",status:"Active",color:GR,desc:"Healthy activity. Easy to enter and exit at fair prices."},{label:"300–999 contracts",status:"Moderate",color:GD,desc:"Manageable. Check Open Interest alongside before entering."},{label:"Under 300 contracts",status:"Thin",color:"#8a7560",desc:"Low activity. Harder to exit quickly at a fair price."}],checklist:null},
  oi:{icon:"🏛️",label:"Open Interest",color:GR,group:"liquidity",short:"Total open contracts — the deeper measure of liquidity.",what:"Total contracts currently open and not yet closed. Unlike Volume, it doesn't reset daily — only changes when contracts are opened or closed.",why:"Shows market depth for a specific strike. High OI = many traders, easy to find a buyer when you exit. Low OI = you may be alone in the position.",analogy:"Volume is how many people walked through the store door today. Open Interest is how many people are still inside the building. Total crowd size versus today's visitors.",rule:"Look for 500 or more open interest on your strike before entering. Lower OI is a yellow flag — not always a dealbreaker, but check the spread carefully. Tight spread with lower OI can still be tradeable.",example:"Strike $50 has 12,400 open interest — very deep. Strike $54 has only 850. Selling the $54 position in a hurry may mean accepting a worse price to find a buyer quickly.",zones:[{label:"500+ open interest",status:"Good",color:GR,desc:"Healthy liquidity. Easier to enter and exit at a fair price."},{label:"200–500 open interest",status:"Caution",color:GD,desc:"Check the spread before entering. Manageable but watch closely."},{label:"Under 200 open interest",status:"Warning",color:RD,desc:"Thin market. Wide spreads likely. Hard to exit at a fair price."}],checklist:null},
};

const GROUPS = {
  pricing:  {label:"💵 Pricing",   color:RD,keys:["strike","expiry","ask","bid","last"],desc:"The core contract properties — what it costs, when it expires, and where real trades happen."},
  greeks:   {label:"🔢 The Greeks", color:OR,keys:["delta","theta","gamma","vega"],desc:"Mathematical measures that describe how your contract behaves and what risks you carry."},
  liquidity:{label:"💧 Liquidity",  color:GR,keys:["volume","oi"],desc:"Measures of market activity — how easy it is to get in and out of a position."},
};

function getM(s) { return s < STOCK ? "ITM" : s === STOCK ? "ATM" : "OTM"; }
function fmtK(v) { return v >= 1000 ? (v/1000).toFixed(1)+"K" : v.toString(); }

function NextBtn({ label, onClick }) {
  return (
    <button onClick={onClick} style={{background:OR,border:"none",borderRadius:"999px",padding:"10px 26px",color:"#fff",fontWeight:"700",fontSize:"0.82rem",letterSpacing:"0.06em",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px",margin:"24px auto 0"}}>
      {label} →
    </button>
  );
}

function MTag({ m }) {
  const c={ITM:{bg:"#e8faf3",color:GR},ATM:{bg:"#fff4eb",color:OR},OTM:{bg:"#f7f0e6",color:"#8a7560"}}[m];
  return <span style={{display:"inline-block",padding:"2px 7px",borderRadius:"999px",background:c.bg,color:c.color,fontSize:"9px",fontWeight:"700",letterSpacing:"0.08em"}}>{m}</span>;
}

function ZoneRow({ z }) {
  return (
    <div style={{display:"flex",gap:"10px",alignItems:"flex-start",padding:"8px 12px",borderRadius:"8px",background:"#f7f0e6",marginBottom:"5px"}}>
      <div style={{width:"7px",height:"7px",borderRadius:"50%",background:z.color,marginTop:"5px",flexShrink:0}}/>
      <div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap",marginBottom:"2px"}}>
          <span style={{fontWeight:"700",fontSize:"0.75rem",color:DK}}>{z.label}</span>
          <span style={{fontSize:"0.68rem",fontWeight:"700",color:z.color,background:"#fff",padding:"1px 7px",borderRadius:"999px",border:"1px solid "+z.color+"44"}}>{z.status}</span>
        </div>
        <div style={{fontSize:"0.72rem",color:"#5a4535",lineHeight:"1.5"}}>{z.desc}</div>
      </div>
    </div>
  );
}

function TermCard({ termKey, isOpen, onToggle }) {
  const t = TERMS[termKey];
  return (
    <div style={{border:"1px solid "+BD,borderRadius:"12px",overflow:"hidden",marginBottom:"8px",background:CA}}>
      <div onClick={onToggle} style={{display:"flex",alignItems:"center",gap:"12px",padding:"14px 16px",cursor:"pointer",borderLeft:"4px solid "+t.color,background:isOpen?"#fffcf7":CA,transition:"background 0.15s"}}>
        <span style={{fontSize:"1.2rem",flexShrink:0}}>{t.icon}</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:"700",fontSize:"0.9rem",color:DK,marginBottom:"2px"}}>{t.label}</div>
          <div style={{fontSize:"0.75rem",color:"#8a7560",lineHeight:"1.4"}}>{t.short}</div>
        </div>
        <span style={{color:"#8a7560",fontSize:"13px",flexShrink:0,transition:"transform 0.2s",transform:isOpen?"rotate(180deg)":"rotate(0deg)"}}>▼</span>
      </div>
      {isOpen && (
        <div className="fu" style={{borderTop:"1px solid "+BD}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0"}}>
            <div style={{padding:"16px",borderRight:"1px solid "+BD}}>
              <Sec icon="📖" label="What it is" bg="#f7f0e6">{t.what}</Sec>
              <Sec icon="💡" label="Why it matters" bg="#f7f0e6" mt>{t.why}</Sec>
            </div>
            <div style={{padding:"16px"}}>
              {t.rule && <Sec icon="⚡" label="The Rule" bg="linear-gradient(130deg,#1a1108,#2c1d0e)" dark>{t.rule}</Sec>}
              <Sec icon="📊" label="Real example" bg="#e8faf3" green mt={!!t.rule}>{t.example}</Sec>
              {t.zones && <div style={{marginTop:"12px"}}><div style={{fontSize:"0.65rem",fontWeight:"700",letterSpacing:"0.12em",textTransform:"uppercase",color:"#8a7560",marginBottom:"7px"}}>Reference zones</div>{t.zones.map((z,i)=><ZoneRow key={i} z={z}/>)}</div>}
              {t.checklist && <div style={{marginTop:"10px",background:"#fff4eb",border:"1px solid #fad0a8",borderRadius:"8px",padding:"9px 12px",display:"flex",gap:"7px",alignItems:"flex-start"}}><span style={{fontSize:"0.9rem",flexShrink:0}}>📋</span><div style={{fontSize:"0.72rem",color:"#6b4b28",lineHeight:"1.5"}}><strong style={{color:OR}}>Pre-Trade Checklist</strong><br/>{t.checklist}</div></div>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Sec({ icon, label, bg, dark, green, italic, mt, children }) {
  return (
    <div style={{background:bg,borderRadius:"8px",padding:"11px 13px",marginTop:mt?"10px":"0"}}>
      <div style={{fontSize:"0.62rem",fontWeight:"700",letterSpacing:"0.12em",textTransform:"uppercase",color:dark?"#9a7a55":green?"#065f46":"#8a7560",marginBottom:"6px"}}>{icon} {label}</div>
      <div style={{fontSize:"0.8rem",lineHeight:"1.65",color:dark?"#e8ddd0":green?"#052e16":"#3d2e1e",fontStyle:italic?"italic":"normal"}}>{children}</div>
    </div>
  );
}

function ColHead({ colKey, activeCol, onClick }) {
  const isActive = activeCol === colKey;
  const t = TERMS[colKey];
  if (!t) return <th style={{padding:"9px 10px"}}><span style={{fontSize:"0.6rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:"#8a7560"}}>{colKey.toUpperCase()}</span></th>;
  return (
    <th onClick={() => onClick(colKey)} style={{padding:"9px 10px",cursor:"pointer",userSelect:"none",borderBottom:isActive?"3px solid "+t.color:"3px solid transparent",background:isActive?"#fff4eb":"transparent",transition:"all 0.15s",whiteSpace:"nowrap"}}>
      <span style={{fontSize:"0.6rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:isActive?t.color:"#8a7560",display:"flex",alignItems:"center",gap:"3px"}}>
        {t.icon} {t.label.split(" ")[0]} {t.label.includes("(") ? t.label.match(/\(.\)/)?.[0]||"" : ""}
        <span style={{opacity:0.4,fontSize:"9px"}}>▼</span>
      </span>
    </th>
  );
}

// Condensed quick-reference panel — brief definition, threshold, rule only
const CHAIN_QUICK = {
  strike:{def:"The price at which you agree to buy the stock — locked in when you buy the contract.",threshold:null,zones:[{label:"Below stock price",status:"ITM",color:GR},{label:"At stock price",status:"ATM",color:OR},{label:"Above stock price",status:"OTM",color:"#8a7560"}]},
  ask:{def:"What you pay to buy the contract. Always the higher of the two quoted prices.",threshold:"Multiply by 100 for your real cost. Ask $1.30 = $130 per contract.",zones:null},
  bid:{def:"What you receive when you sell the contract. Always the lower of the two quoted prices.",threshold:"Spread = Ask − Bid. Under 5% is clean. Over 10%, enter with caution.",zones:null},
  last:{def:"The most recent real transaction price — what a buyer and seller actually agreed on.",threshold:"Place your limit order between Last and Ask for a better entry than the full Ask.",zones:null},
  delta:{def:"How much your contract moves for every $1 the stock moves.",threshold:null,zones:[{label:"0.80–1.00",status:"Deep ITM",color:GR},{label:"0.40–0.60 ✓",status:"Sweet Spot",color:OR},{label:"0.20–0.40",status:"OTM",color:GD},{label:"0.00–0.20",status:"Deep OTM",color:RD}]},
  theta:{def:"How much value your contract loses every single day — even when the stock doesn't move.",threshold:"Theta should be no more than 50% of your Delta. Higher = time working too hard against you.",zones:[{label:"30+ days to expiry",status:"Safe",color:GR},{label:"15–30 days",status:"Caution",color:GD},{label:"Under 15 days",status:"Danger",color:RD}]},
  gamma:{def:"How fast your Delta changes when the stock moves $1.",threshold:"Highest near ATM. Means your contract becomes more or less responsive as the stock moves.",zones:null},
  vega:{def:"How much your contract's value changes for every 1% move in Implied Volatility.",threshold:"High Vega near earnings = extra risk. IV collapses after the announcement even if the stock moved your way.",zones:null},
  volume:{def:"Total contracts traded today. Resets every morning at market open.",threshold:null,zones:[{label:"1,000+",status:"Active",color:GR},{label:"300–999",status:"Moderate",color:GD},{label:"Under 300",status:"Thin",color:"#8a7560"}]},
  oi:{def:"Total open contracts not yet closed. Does not reset daily — a deeper liquidity measure.",threshold:null,zones:[{label:"500+ open interest",status:"Good",color:GR},{label:"200–500",status:"Caution",color:GD},{label:"Under 200",status:"Warning",color:RD}]},
};

function ChainInfoPanel({ colKey }) {
  const [strikeMode, setStrikeMode] = useState("call");
  const t = TERMS[colKey];
  const q = CHAIN_QUICK[colKey];
  if (!t || !q) return null;

  const isStrike = colKey === "strike";
  const strikeZones = strikeMode === "call"
    ? [{label:"Below stock price",status:"ITM",color:GR},{label:"At stock price",status:"ATM",color:OR},{label:"Above stock price",status:"OTM",color:"#8a7560"}]
    : [{label:"Above stock price",status:"ITM",color:GR},{label:"At stock price",status:"ATM",color:OR},{label:"Below stock price",status:"OTM",color:"#8a7560"}];
  const activeZones = isStrike ? strikeZones : q.zones;

  return (
    <div className="fu" style={{background:CA,border:"1px solid "+BD,borderLeft:"4px solid "+t.color,borderRadius:"12px",padding:"14px 18px",marginTop:"8px"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"12px",flexWrap:"wrap"}}>
        <span style={{fontSize:"1.2rem"}}>{t.icon}</span>
        <div>
          <div style={{fontWeight:"700",fontSize:"0.95rem",color:DK}}>{t.label}</div>
          <div style={{fontSize:"0.72rem",color:"#8a7560",fontStyle:"italic",marginTop:"1px"}}>{t.short}</div>
        </div>
        <div style={{marginLeft:"auto",fontSize:"0.62rem",color:"#8a7560",fontStyle:"italic"}}>← See "Learn the Terms" for the full breakdown</div>
      </div>

      {/* Strike toggle */}
      {isStrike && (
        <div style={{display:"flex",gap:"3px",background:"#e4d8c8",borderRadius:"8px",padding:"3px",marginBottom:"12px",maxWidth:"220px"}}>
          {[["call","📈 Call"],["put","📉 Put"]].map(([m,l])=>(
            <button key={m} onClick={()=>setStrikeMode(m)} style={{
              flex:1, padding:"6px 10px", border:"none", borderRadius:"6px", cursor:"pointer",
              fontWeight:"700", fontSize:"0.72rem", transition:"all 0.15s",
              background: strikeMode===m ? "#fff" : "transparent",
              color: strikeMode===m ? (m==="call" ? GR : RD) : "#8a7560",

function PriceLine({ mode }) {
  const isCall = mode === "call";
  const stock = 50;
  const strikes = [46, 48, 50, 52, 54];
  const labels = { 46:"$46", 48:"$48", 50:"$50", 52:"$52", 54:"$54" };
  function getMoney(s) {
    if (s === stock) return "ATM";
    if (isCall) return s < stock ? "ITM" : "OTM";
    return s > stock ? "ITM" : "OTM";
  }
  function getColor(m) { return m === "ITM" ? GR : m === "ATM" ? OR : "#b0a090"; }
  return (
    <div style={{padding:"20px 16px",background:"#f7f0e6",borderRadius:"12px",marginBottom:"12px"}}>
      <div style={{position:"relative",height:"6px",background:"#e0d4c0",borderRadius:"3px",margin:"30px 10px 40px"}}>
        <div style={{position:"absolute",left:"50%",transform:"translateX(-50%)",top:"-28px",textAlign:"center"}}>
          <div style={{background:DK,color:"#fff",fontSize:"0.65rem",fontWeight:"700",padding:"2px 8px",borderRadius:"999px",whiteSpace:"nowrap"}}>Stock $50.00</div>
          <div style={{width:"2px",height:"10px",background:DK,margin:"2px auto 0"}}/>
        </div>
        <div style={{position:"absolute",left:"50%",transform:"translateX(-50%)",width:"12px",height:"12px",borderRadius:"50%",background:DK,top:"-3px"}}/>
        {strikes.map((s, i) => {
          const pct = (i / (strikes.length - 1)) * 100;
          const m = getMoney(s);
          const c = getColor(m);
          return (
            <div key={s} style={{position:"absolute",left:pct+"%",transform:"translateX(-50%)",textAlign:"center"}}>
              <div style={{width:"14px",height:"14px",borderRadius:"50%",background:c,border:"2px solid #fff",top:"-4px",position:"absolute",left:"50%",transform:"translateX(-50%)",boxShadow:"0 1px 4px rgba(0,0,0,0.15)"}}/>
              <div style={{marginTop:"24px",fontSize:"0.72rem",fontWeight:"700",color:c,whiteSpace:"nowrap"}}>{labels[s]}</div>
              <div style={{fontSize:"0.6rem",fontWeight:"700",color:c,letterSpacing:"0.06em"}}>{m}</div>
            </div>
          );
        })}
        {isCall
          ? <div style={{position:"absolute",left:"0",width:"50%",height:"100%",background:GR+"44",borderRadius:"3px 0 0 3px"}}/>
          : <div style={{position:"absolute",right:"0",width:"50%",height:"100%",background:GR+"44",borderRadius:"0 3px 3px 0"}}/>
        }
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:"4px"}}>
        <div style={{fontSize:"0.68rem",color:"#8a7560",display:"flex",alignItems:"center",gap:"4px"}}>
          <span>←</span>
          <span style={{fontWeight:isCall?"400":"700",color:!isCall?RD:"#8a7560"}}>{!isCall?"Profit zone (Put goes ITM)":"Lower strikes"}</span>
        </div>
        <div style={{fontSize:"0.68rem",color:"#8a7560",display:"flex",alignItems:"center",gap:"4px"}}>
          <span style={{fontWeight:isCall?"700":"400",color:isCall?GR:"#8a7560"}}>{isCall?"Profit zone (Call goes ITM)":"Higher strikes"}</span>
          <span>→</span>
        </div>
      </div>
    </div>
  );
}

          <span style={{fontSize:"0.65rem",color:"#b0a090",fontStyle:"italic"}}>Example chain · For educational purposes only · Not a real ticker</span>
        </div>
      </div>

      {/* Always-visible toggle shortcuts */}
      <div style={{marginTop:"12px",background:CA,border:"1px solid "+BD,borderRadius:"12px",padding:"16px 20px"}}>
        <div style={{fontSize:"0.65rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:"#8a7560",marginBottom:"14px",textAlign:"center"}}>Quick reference — tap any term to expand</div>
        {[
          {label:"💵 Pricing", keys:["strike","ask","bid","last"]},
          {label:"🔢 Greeks",  keys:["delta","theta","gamma","vega"]},
          {label:"💧 Liquidity",keys:["volume","oi"]},
        ].map(group => (
          <div key={group.label} style={{marginBottom:"12px"}}>
            <div style={{fontSize:"0.58rem",fontWeight:"700",letterSpacing:"0.12em",textTransform:"uppercase",color:"#b0a090",marginBottom:"7px"}}>{group.label}</div>
            <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
              {group.keys.map(k=>(
                <button key={k} onClick={() => handleCol(k)} style={{
                  background: activeCol===k ? (TERMS[k]?.color||OR) : "#f0e8da",
                  border: "1px solid "+(activeCol===k ? (TERMS[k]?.color||OR) : BD),
                  borderRadius:"999px",
                  padding:"6px 14px",
                  fontSize:"0.68rem",
                  fontWeight:"700",
                  letterSpacing:"0.08em",
                  textTransform:"uppercase",
                  color: activeCol===k ? "#fff" : "#5a4535",
                  cursor:"pointer",
                  transition:"all 0.15s",
                }}>
                  {TERMS[k].icon} {k.toUpperCase()}
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
      {activeCol && <ChainInfoPanel colKey={activeCol}/>}


    </div>
  );
}

function App() {
  const [tab, setTab] = useState(0);
  const TABS = [
    {label:"Learn the Terms", icon:"🔢"},
    {label:"Moneyness",       icon:"🎯"},
    {label:"The Chain",       icon:"📊"},
  ];
  return (
    <div style={{minHeight:"100vh",background:"#F5F0E8"}}>

      {/* Topbar */}
      <div style={{background:DK,padding:"11px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:"1.2rem",color:"#fff"}}>demystified</span>
        <a href="https://options101-hub.vercel.app/"
          style={{display:"flex",alignItems:"center",gap:"6px",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.14)",borderRadius:"999px",padding:"5px 14px",textDecoration:"none"}}
          onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,0.15)"}
          onMouseOut={e=>e.currentTarget.style.background="rgba(255,255,255,0.08)"}>
          <span style={{color:"#d4a87a",fontSize:"0.8rem"}}>←</span>
          <span style={{fontSize:"0.65rem",fontWeight:"700",letterSpacing:"0.1em",textTransform:"uppercase",color:"#d4a87a"}}>Options 101 Hub</span>
        </a>
        <div style={{width:"22px",height:"22px",background:OR,borderRadius:"5px"}}/>
      </div>

      <div style={{maxWidth:"860px",margin:"0 auto",padding:"22px 16px"}}>
        <div style={{marginBottom:"18px"}}>

          <h1 style={{fontFamily:"Georgia,serif",fontSize:"clamp(1.7rem,4vw,2.3rem)",color:DK,letterSpacing:"-0.03em",lineHeight:"1.15",marginBottom:"4px"}}>The Options Chain</h1>
          <p style={{color:"#8a7560",fontSize:"0.85rem"}}>Learn the language of the options chain.</p>
        </div>

        <div style={{display:"flex",gap:"3px",background:"#e4d8c8",borderRadius:"12px",padding:"3px",marginBottom:"10px"}}>
          {TABS.map((t,i)=>(
            <button key={i} onClick={()=>setTab(i)} style={{flex:1,padding:"9px 6px",border:"none",borderRadius:"9px",cursor:"pointer",fontWeight:"700",fontSize:"0.72rem",letterSpacing:"0.03em",transition:"all 0.18s",background:tab===i?"#fff":"transparent",color:tab===i?OR:"#8a7560",boxShadow:tab===i?"0 1px 6px rgba(0,0,0,0.09)":"none",lineHeight:"1.3"}}>
              <div>{t.icon}</div>
              <div style={{marginTop:"2px"}}>{t.label}</div>
            </button>
          ))}
        </div>

        <div style={{height:"3px",background:"#e4d8c8",borderRadius:"2px",marginBottom:"20px"}}>
          <div style={{height:"100%",width:[0,33,66,100][tab]+"%",background:OR,borderRadius:"2px",transition:"width 0.4s ease"}}/>
        </div>

        {tab===0 && <Tab1 onNext={()=>setTab(1)}/>}
        {tab===1 && <Tab2 onNext={()=>setTab(2)}/>}
        {tab===2 && <Tab3/>}

        <div style={{marginTop:"24px",textAlign:"center",fontSize:"0.65rem",color:"#b0a090",letterSpacing:"0.05em"}}>
          <span style={{fontFamily:"Georgia,serif",fontStyle:"italic"}}>demystified</span> · For educational purposes only
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
